// Data shim: same call shapes the app already uses, backed by Firestore.
// Filtering happens in queries; sorting/limits are applied client-side (family-scale data,
// avoids Firestore composite-index requirements entirely).
function docToObj(d){ return Object.assign({ id: d.id }, d.data()); }
class QB {
  constructor(coll){ this.coll = coll; this.filters = []; this.orders = []; this.limitN = null; this.mode = 'select'; this.payload = null; this._single = false; }
  select(){ this.mode = 'select'; return this; }
  insert(payload){ this.mode = 'insert'; this.payload = payload; return this._exec(); }
  update(payload){ this.mode = 'update'; this.payload = payload; return this; }
  delete(){ this.mode = 'delete'; return this; }
  eq(f, v){ this.filters.push({ f, op: '==', v }); return this; }
  in(f, vals){ this.filters.push({ f, op: 'in', v: vals }); return this; }
  order(f, opts){ this.orders.push({ f, dir: (opts && opts.ascending === false) ? -1 : 1 }); return this; }
  limit(n){ this.limitN = n; return this; }
  single(){ this._single = true; return this._exec(); }
  then(res, rej){ return this._exec().then(res, rej); }
  _query(){
    let q = fdb.collection(this.coll);
    for (const flt of this.filters) {
      // Firestore document ids are not stored as a field; an 'id' filter must
      // target the document path itself or it silently matches nothing.
      const field = flt.f === 'id' ? firebase.firestore.FieldPath.documentId() : flt.f;
      q = q.where(field, flt.op, flt.v);
    }
    return q;
  }
  async _exec(){
    try {
      if (this.mode === 'insert') {
        const INSERT_DEFAULTS = {
          items: { archived: false },
          claims: { active: true },
          pledges: { active: true },
          waitlist: { active: true },
          flags: { seen: false },
          people: { active: true, pin: null, is_organizer: false }
        };
        const p = Object.assign({}, INSERT_DEFAULTS[this.coll] || {}, this.payload);
        if (!('created_at' in p)) p.created_at = new Date().toISOString();
        await fdb.collection(this.coll).add(p);
        return { data: null, error: null };
      }
      const snap = await this._query().get();
      const docs = snap.docs;
      if (this.mode === 'update') {
        const batch = fdb.batch();
        docs.forEach(d => batch.update(d.ref, this.payload));
        await batch.commit();
        return { data: null, error: null };
      }
      if (this.mode === 'delete') {
        const batch = fdb.batch();
        docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        return { data: null, error: null };
      }
      let rows = docs.map(docToObj);
      for (let i = this.orders.length - 1; i >= 0; i--) {
        const o = this.orders[i];
        rows.sort((a, b) => {
          const av = a[o.f] ?? '', bv = b[o.f] ?? '';
          if (av < bv) return -1 * o.dir;
          if (av > bv) return 1 * o.dir;
          return 0;
        });

      if (this._single) return { data: rows[0] || null, error: null };
      return { data: rows, error: null };
    } catch (e) {
      return { data: null, error: { message: String((e && e.message) || e) } };
    }
  }

let extraNames = {};       // names of people from other spaces (e.g. cross-space claimers)
async function resolveNames(ids){
  const missing = [...new Set(ids)].filter(id => id && !people.find(p => p.id === id) && !extraNames[id]);
  if (!missing.length) return;
  const { data } = await sb.from('people').select('*').in('id', missing);
  (data || []).forEach(p => { extraNames[p.id] = p.name; });
}

// Instant tap feedback: mark any tapped button busy (dimmed + locked) until the
// next render replaces the DOM, so a tap always visibly registers and can't double-fire.
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.btn, .person-btn');
  if (!b || b.classList.contains('busy')) return;
  b.classList.add('busy');
  setTimeout(() => b.classList.remove('busy'), 2500);
}, true);
new MutationObserver(() => {
  document.querySelectorAll('.btn.busy').forEach(b => b.classList.remove('busy'));
}).observe(document.getElementById('app'), { childList: true });

function uiConfirm(msg){
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    ov.innerHTML = '<div class="card" style="max-width:340px;width:100%;text-align:center"><p style="margin-bottom:14px">' + esc(msg) + '</p><div class="rowflex" style="justify-content:center;gap:10px"><button class="btn green" data-ok="1">OK</button><button class="btn ghost" data-ok="0">' + esc(t().cancel) + '</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-ok]'); if (!b) return;
      ov.remove(); res(b.dataset.ok === '1');
    });
  });
}
// Item photos: picked files (photos or screenshots) are shrunk in the browser and stored
// with the item, so no separate photo service is needed.
const photoState = {};
function readPhotoFile(file, cb){
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const max = 900; const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/jpeg', 0.72));
  };
  img.src = url;
}
function wirePhoto(inputId, prevId, key){
  const inp = document.getElementById(inputId);
  if (!inp) return;
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    readPhotoFile(f, (dataUrl) => {
      photoState[key] = dataUrl;
      const prev = document.getElementById(prevId);
      if (prev) { prev.src = dataUrl; prev.classList.remove('hidden'); }
    });
  });
}

async function findSpace(code){
  if (!code) return null;
  const c = String(code).trim().toLowerCase();
  const { data } = await sb.from('spaces').select('*').eq('code', c);
  if (data && data.length) return data[0];
  // Legacy fallback: the original single-family code still opens the Centeno space.
  const { data: cfg } = await sb.from('config').select('*').eq('key','family_code').single();
  if (cfg && String(cfg.value).toLowerCase() === c) return { id: 'centeno', code: cfg.value, name: 'Centeno Family', mode: 'wishlist', budget: null, draw_done: false };
  return null;
}
async function boot(){
  setLang(lang);
  await ensureSeed();
  let savedCode = localStorage.getItem('fgl_space');
  if (!savedCode && localStorage.getItem('fgl_code') === 'ok') savedCode = 'centeno'; // pre-spaces sessions
  space = await findSpace(savedCode || '');
  if (!space) return renderGate();
  localStorage.setItem('fgl_space', space.code);
  window._familyCode = space.code;
  await loadPeople();
  const savedId = localStorage.getItem('fgl_person');
  me = people.find(p => p.id === savedId) || null;
  if (!me) return renderWho();
  lang = me.lang || lang; setLang(lang);
  renderHome();
}
async function loadPeople(){
  const { data } = await sb.from('people').select('*').eq('active', true).order('created_at');
  people = (data || []).filter(p => (p.space || 'centeno') === (space ? space.id : 'centeno'));
  const { data: hs } = await sb.from('helpers').select('*');
  helpersMap = {};
  (hs || []).forEach(h => { (helpersMap[h.person_id] = helpersMap[h.person_id] || []).push(h.helper_id); });
}
function render(){ if (!me) { boot(); } else { renderHome(); } }

// ---------- Sorting / filtering (shared by owner + shopper lists) ----------
let uiSort = 'stars';
let uiFilter = 'all';
function sortItems(list){
  const a = [...(list || [])];
  const byCreated = (x, y) => new Date(x.created_at) - new Date(y.created_at);
  if (uiSort === 'priceAsc')  return a.sort((x, y) => (x.price ?? Infinity) - (y.price ?? Infinity) || byCreated(x, y));
  if (uiSort === 'priceDesc') return a.sort((x, y) => (y.price ?? -1) - (x.price ?? -1) || byCreated(x, y));
  if (uiSort === 'newest')    return a.sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
  if (uiSort === 'name')      return a.sort((x, y) => String(x.title).localeCompare(String(y.title)));
  return a.sort((x, y) => (x.priority - y.priority) || byCreated(x, y));
}

function similar(a, b){
  a = (a||'').toLowerCase().trim(); b = (b||'').toLowerCase().trim();
  if (!a || !b) return false;
  if (a.includes(b) || b.includes(a)) return true;
  const aw = new Set(a.split(/\W+/).filter(w => w.length > 2));
  const bw = new Set(b.split(/\W+/).filter(w => w.length > 2));
  if (!aw.size || !bw.size) return false;
  let shared = 0; bw.forEach(w => { if (aw.has(w)) shared++; });
  return shared / Math.min(aw.size, bw.size) >= 0.6;
}

      let image = it.image || null;
      const urlIn = $(`#e-photo-url-${it.id}`).value.trim();
      if (urlIn) image = urlIn;
      if (photoState['e' + it.id]) image = photoState['e' + it.id];
      if (box.dataset.imgRemoved === '1') image = null;
      const { error } = await sb.from('items').update({
        title, url: $(`#e-url-${it.id}`).value.trim() || null,
        price: $(`#e-price-${it.id}`).value ? Number($(`#e-price-${it.id}`).value) : null,
        notes: $(`#e-notes-${it.id}`).value.trim() || null,
        image,
        priority: Number($(`#e-prio-${it.id}`).value),
        updated_at: new Date().toISOString()
      }).eq('id', it.id);
      if (error) { toast(error.message); return; }
      await logActivity(me.id, ownerId, it.id, 'item_edit', title);
      toast(t().savedOk); renderOwnerList(ownerId);
    });
  }));
}
// When an owner/helper changes or removes an item that shoppers have claimed or pooled,
// flag those shoppers (they are told something changed — the owner learns nothing).
async function notifyClaimersChanged(itemId, item, owner){
  if (!item) return;
  const [{ data: claims }, { data: pledges }] = await Promise.all([
    sb.from('claims').select('*').eq('item_id', itemId).eq('active', true),
    sb.from('pledges').select('*').eq('item_id', itemId).eq('active', true)
  ]);
  const targets = new Set();
  (claims||[]).forEach(c => targets.add(c.claimer_id));
  (pledges||[]).forEach(p => targets.add(p.person_id));
  targets.delete(owner.id);
  for (const pid of targets) await flag(pid, itemId, t().itemChangedFlag(item.title, owner.name));
}
// ---------- Shopper list (claims + pools visible) ----------
async function renderShopList(ownerId, nav){
  if (nav) { paintLoading(); await new Promise(r => setTimeout(r, 30)); }
  const owner = people.find(p => p.id === ownerId);
  const effOwner = listOwnerId(owner);
  const shared = !!(owner && owner.alias_of);
  const { data: items } = await sb.from('items').select('*').eq('owner_id', effOwner).eq('archived', false).order('priority').order('created_at');
  const ids = (items || []).map(i => i.id);
  let claims = [], pledges = [], line = [];
  if (ids.length && (!isSS() || shared)) {
    const [c, p, w] = await Promise.all([
      sb.from('claims').select('*').in('item_id', ids).eq('active', true),
      sb.from('pledges').select('*').in('item_id', ids).eq('active', true),
      sb.from('waitlist').select('*').in('item_id', ids).eq('active', true).order('created_at')
    ]);
    claims = c.data || []; pledges = p.data || []; line = w.data || [];
  }
  await resolveNames([...claims.map(c => c.claimer_id), ...pledges.map(p => p.person_id), ...line.map(w => w.person_id)]);
  const dispName = (id) => people.find(p => p.id === id) ? personName(id) : t().someoneAnon;   // never show the other family's names
  const { data: shopQs } = await sb.from('questions').select('*').eq('owner_id', effOwner).order('created_at');
  const prioStars = (n) => '⭐'.repeat(4 - n);
  const claimsOn = !isSS() || shared;
  const statusOf = (it) => {
    if (claims.find(c => c.item_id === it.id)) return 'claimed';
    const pls = pledges.filter(p => p.item_id === it.id);
    if (it.price != null && pls.length && pls.reduce((s, p) => s + Number(p.amount), 0) >= Number(it.price)) return 'claimed';
    return 'open';
  };
  const shownItems = sortItems((items || []).filter(it => !claimsOn || uiFilter === 'all' || statusOf(it) === uiFilter));
  const itemHtml = (it) => {
    const claim = claims.find(c => c.item_id === it.id);
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooled = pls.reduce((s, p) => s + Number(p.amount), 0);
    const funded = it.price != null && pooled >= Number(it.price) && pls.length > 0;
    const myPledge = pls.find(p => p.person_id === me.id);
    const waiters = line.filter(w => w.item_id === it.id);
    const myLine = waiters.find(w => w.person_id === me.id);
    let chips = '';
    if (claim) chips += claim.status === 'wrapped'
      ? `<span class="chip wrapped">${t().statusWrapped(dispName(claim.claimer_id))}</span>`
      : `<span class="chip ${claim.status === 'bought' ? 'bought' : 'claimed'}">${claim.status === 'bought' ? t().statusBought(dispName(claim.claimer_id)) : t().statusClaimed(dispName(claim.claimer_id))}</span>`;
    else if (funded) chips += `<span class="chip funded">${t().statusFunded}</span><span class="chip pool">${t().statusPool(pooled, it.price)}</span>`;
    else if (pls.length) chips += `<span class="chip pool">${t().statusPool(pooled, it.price)}</span>`;
    else chips += `<span class="chip open">${t().statusOpen}</span>`;
    if (waiters.length) chips += `<span class="chip">${t().inLine(waiters.map(w => dispName(w.person_id)).join(', '))}</span>`;
    let actions = '';
    if (claim && claim.claimer_id === me.id) {
      if (claim.status === 'claimed') actions += `<button class="btn small green" data-bought="${it.id}">${t().markBought}</button>`;
      if (claim.status === 'bought') actions += `<button class="btn small green" data-wrapped="${it.id}">${t().markWrapped}</button>`;
      actions += `<button class="btn small ghost" data-release="${it.id}">${t().release}</button>`;
    } else if (!claim && !funded && !pls.length) {
      actions += `<button class="btn small red" data-claim="${it.id}">${t().claim}</button>`;
    }
    if (!claim && it.price != null && !funded) {
      actions += myPledge
        ? `<button class="btn small ghost" data-withdraw="${it.id}">${t().release} (${money(myPledge.amount)})</button>`
        : `<span class="rowflex"><input type="number" id="pl-${it.id}" placeholder="${t().pledgePh}" min="1" step="0.01" inputmode="decimal" style="max-width:150px"><button class="btn small green" data-pledge="${it.id}">${t().joinPool}</button></span>`;
    }
    if (claim && claim.claimer_id !== me.id) {
      actions += myLine
        ? `<button class="btn small ghost" data-unline="${it.id}">${t().leaveLine}</button><span class="muted">${t().youNext}</span>`
        : `<button class="btn small ghost" data-line="${it.id}">${t().getInLine}</button>`;
    }
    if (isSS() && !shared) { chips = ''; actions = ''; }
    return `
      <div class="item" ${it.priority === 1 ? 'style="border-left:5px solid #c99700"' : ''}>
        <h3>${esc(it.title)}</h3>
        ${itemImg(it)}
        <span class="prio">${prioStars(it.priority)}</span>
        ${it.price != null ? `<span class="price">${money(it.price)}</span>` : `<span class="muted">${t().noPrice}</span>`}
        ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ''}
        ${it.url ? `<div><a class="buy" href="${esc(it.url)}" target="_blank" rel="noopener">${t().viewLink}</a></div>` : ''}
        ${newBadge(it)}
        <div style="margin:8px 0">${chips}</div>
        <div class="rowflex">${actions}</div>
      </div>`;
  };
  app.innerHTML = `
    <button class="btn small ghost" id="s-back">${t().backHome}</button>
    <div class="hat shop">${t().hatShop(me.name)}</div>
    <div class="card"><h2>${faceFor(owner.id)} ${esc(owner.name)}</h2>
      ${sortBarHtml(claimsOn)}
      ${(items && items.length) ? (shownItems.length ? shownItems.map(itemHtml).join('') : `<p class="muted">${t().filterNone}</p>`) : `<p class="muted">${t().emptyListShop}</p>`}
    </div>
    <div class="card">
      <h2>${t().askTitle}</h2>
      <p class="muted">${t().askHelp}</p>
      ${(shopQs || []).map(q => `
        <div class="item">
          <div>❓ ${esc(q.question)}</div>
          ${q.answer ? `<div class="notes">💬 ${esc(q.answer)}</div>` : `<div class="muted">${t().unanswered}</div>`}
        </div>`).join('')}
      <textarea id="q-text" placeholder="${t().askPh}"></textarea>
      <div style="height:8px"></div>
      <button class="btn green" id="q-ask">${t().askBtn}</button>
    </div>`;
  $('#s-back').addEventListener('click', renderHome);
  const rerender = () => renderShopList(ownerId);
  wireSortBar(rerender);
  $('#q-ask').addEventListener('click', async () => {
    const qtext = $('#q-text').value.trim(); if (!qtext) { $('#q-text').focus(); return; }
    const { error } = await sb.from('questions').insert({ owner_id: effOwner, question: qtext });
    if (error) { toast(error.message); return; }
    const ownerLang = (owner.lang === 'es') ? 'es' : 'en';
    await flag(ownerId, null, T[ownerLang].newQFlag);
    toast(t().askedOk); rerender();
  });
  app.querySelectorAll('[data-claim]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.claim);
    const { data: existing } = await sb.from('claims').select('*').eq('item_id', it.id).eq('active', true);
    if (existing && existing.length) { toast(t().statusClaimed(dispName(existing[0].claimer_id))); return rerender(); }
    const { error } = await sb.from('claims').insert({ item_id: it.id, claimer_id: me.id, status: 'claimed' });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'claim', it.title);
    toast(t().claimedOk); rerender();
  }));
  app.querySelectorAll('[data-bought]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.bought);
    await sb.from('claims').update({ status: 'bought' }).eq('item_id', it.id).eq('claimer_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'bought', it.title);
    toast(t().boughtOk); rerender();
  }));
  app.querySelectorAll('[data-wrapped]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.wrapped);
    await sb.from('claims').update({ status: 'wrapped' }).eq('item_id', it.id).eq('claimer_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'wrapped', it.title);
    toast(t().wrappedOk); rerender();
  }));
  app.querySelectorAll('[data-release]').forEach(b => b.addEventListener('click', async () => {
    if (!(await uiConfirm(t().confirmRelease))) return;
    const it = items.find(x => x.id === b.dataset.release);
    await sb.from('claims').update({ active: false }).eq('item_id', it.id).eq('claimer_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'release', it.title);
    const { data: w } = await sb.from('waitlist').select('*').eq('item_id', it.id).eq('active', true).order('created_at').limit(1);
    if (w && w.length) await flag(w[0].person_id, it.id, t().yourTurnFlag(it.title, owner.name));
    toast(t().releasedOk); rerender();
  }));
  app.querySelectorAll('[data-pledge]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.pledge);
    const inp = $(`#pl-${it.id}`); const amt = Number(inp.value);
    if (!amt || amt <= 0) { inp.focus(); return; }
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooled = pls.reduce((s, p) => s + Number(p.amount), 0);
    const remaining = Math.max(0, Number(it.price) - pooled);
    const finalAmt = Math.min(amt, remaining);
    if (finalAmt <= 0) { toast(t().poolDone); return; }
    const { error } = await sb.from('pledges').insert({ item_id: it.id, person_id: me.id, amount: finalAmt });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'pledge', `${it.title} $${finalAmt}`);
    toast(t().pledgedOk); rerender();
  }));
  app.querySelectorAll('[data-withdraw]').forEach(b => b.addEventListener('click', async () => {
    if (!(await uiConfirm(t().confirmWithdraw))) return;
    const it = items.find(x => x.id === b.dataset.withdraw);
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooledBefore = pls.reduce((s, p) => s + Number(p.amount), 0);
    const wasFunded = it.price != null && pooledBefore >= Number(it.price);
    await sb.from('pledges').update({ active: false }).eq('item_id', it.id).eq('person_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'withdraw', it.title);
    if (wasFunded) {
      for (const p of pls) if (p.person_id !== me.id) await flag(p.person_id, it.id, t().unfundedFlag(it.title, owner.name));
    }
    toast(t().withdrewOk); rerender();
  }));
  app.querySelectorAll('[data-line]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.line);
    const { error } = await sb.from('waitlist').insert({ item_id: it.id, person_id: me.id });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'line', it.title);
    toast(t().lineOk); rerender();
  }));
  app.querySelectorAll('[data-unline]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.unline);
    await sb.from('waitlist').update({ active: false }).eq('item_id', it.id).eq('person_id', me.id).eq('active', true);
    toast(t().leftLineOk); rerender();
  }));
}

      </div>

      <button class="btn ghost" id="e-reset">${t().emojiReset}</button>
    </div>`;
  const back = () => { if (personId === me.id) renderHome(); else renderOwnerList(personId); };
  $('#e-back').addEventListener('click', back);
  const apply = async (emoji) => {
    const { error } = await sb.from('people').update({ emoji }).eq('id', personId);
    if (error) { toast(error.message); return; }
    person.emoji = emoji;
    if (me && me.id === personId) me.emoji = emoji;
    toast(t().emojiSaved); back();
  };
  app.querySelectorAll('[data-emoji]').forEach(b => b.addEventListener('click', () => apply(b.dataset.emoji)));
  $('#e-save-custom').addEventListener('click', () => {
    const v = $('#e-custom').value.trim(); if (!v) { $('#e-custom').focus(); return; }
    let g = v;
    try { const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(v); g = seg[Symbol.iterator]().next().value.segment; } catch (e) { g = [...v][0]; }
    apply(g);
  });
  $('#e-reset').addEventListener('click', () => apply(null));
}

    </div>
    <div class="card">
      <h2>${t().peopleTitle}</h2>
      ${(allPeople||[]).map(p => {
        const hs = (allHelpers||[]).filter(h => h.person_id === p.id).map(h => h.helper_id);
        return `<div class="item">
          <h3>${faceFor(p.id)} ${esc(p.name)} ${p.active ? '' : `<span class="chip">${t().inactive}</span>`} ${p.is_organizer ? '🛠️' : ''}</h3>
          <div class="muted">${t().helpersFor}: ${hs.length ? hs.map(nameOf).join(', ') : '—'}</div>
          <label>${t().helpersFor} ${esc(p.name)}:</label>
          <div class="rowflex">
            <select id="help-${p.id}">${(allPeople||[]).filter(x => x.id !== p.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
            <button class="btn small green" data-addhelp="${p.id}">${t().addBtn}</button>
          </div>
          <div class="rowflex" style="margin-top:6px">
            ${hs.map(hid => `<button class="btn small ghost" data-delhelp="${p.id}:${hid}">✕ ${esc(nameOf(hid))}</button>`).join('')}
          </div>
          <div class="rowflex" style="margin-top:8px">
            <button class="btn small ghost" data-pin="${p.id}">${t().setPin}</button>
            ${p.pin ? `<button class="btn small ghost" data-unpin="${p.id}">${t().clearPin}</button>` : ''}
            ${p.id !== me.id ? `<button class="btn small ghost" data-toggle="${p.id}">${p.active ? t().deactivate : t().reactivate}</button>` : ''}
          </div>
        </div>`; }).join('')}
    </div>
    ${isSS() ? `<div class="card">
      <h2>${t().ssOrgTitle}</h2>
      <p>${t().ssDrawStatus}: <b>${space.draw_done ? t().ssDrawn : t().ssNotYet}</b></p>
      <p class="muted">${t().ssOrgNote}</p>
      <button class="btn red" id="ss-draw">${space.draw_done ? t().ssRedrawBtn : t().ssDrawBtn}</button>
      <div style="height:14px"></div>
      <label>${t().ssBudgetLabel}</label>
      <input type="number" id="ss-budget" min="0" step="1" inputmode="numeric" value="${space.budget ?? ''}">
      <div style="height:10px"></div>
      <button class="btn ghost" id="ss-budget-save">${t().ssSaveBudget}</button>
    </div>` : ''}
    <div class="card">
      <h2>🔐 ${t().changeCode}</h2>
      <input type="text" id="new-code" value="${esc(window._familyCode || '')}">
      <div style="height:10px"></div>
      <button class="btn ghost" id="code-save">${t().save}</button>
    </div>
    <div class="card">
      <h2>${t().activityTitle}</h2>
      <div class="log">${(acts||[]).map(a => `<div>${new Date(a.created_at).toLocaleString()} — <b>${esc(nameOf(a.actor_id))}</b> ${esc(a.type)} ${a.detail ? '· ' + esc(a.detail) : ''}</div>`).join('') || t().nothingHere}</div>
    </div>
    <div class="card">
      <button class="btn ghost" id="season">${t().newSeason}</button>
    </div>`;
  $('#g-back').addEventListener('click', renderHome);
  $('#np-add').addEventListener('click', async () => {
    const name = $('#np-name').value.trim(); if (!name) { $('#np-name').focus(); return; }
    const { error } = await sb.from('people').insert({ name, lang: $('#np-lang').value, space: space.id });
    if (error) { toast(error.message); return; }
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  });
  app.querySelectorAll('[data-addhelp]').forEach(b => b.addEventListener('click', async () => {
    const pid = b.dataset.addhelp; const hid = $(`#help-${pid}`).value;
    const { error } = await sb.from('helpers').insert({ person_id: pid, helper_id: hid });
    if (error && !String(error.message).includes('duplicate')) { toast(error.message); return; }
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  app.querySelectorAll('[data-delhelp]').forEach(b => b.addEventListener('click', async () => {
    const [pid, hid] = b.dataset.delhelp.split(':');
    await sb.from('helpers').delete().eq('person_id', pid).eq('helper_id', hid);
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  app.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', async () => {
    const pin = prompt('PIN (4 digits):'); if (!pin) return;
    await sb.from('people').update({ pin }).eq('id', b.dataset.pin);
    await loadPeople(); toast(t().pinSet); renderOrganizer();
  }));
  app.querySelectorAll('[data-unpin]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('people').update({ pin: null }).eq('id', b.dataset.unpin);
    await loadPeople(); toast(t().pinSet); renderOrganizer();
  }));
  app.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    const p = allPeople.find(x => x.id === b.dataset.toggle);
    await sb.from('people').update({ active: !p.active }).eq('id', p.id);
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  $('#code-save').addEventListener('click', async () => {
    const v = $('#new-code').value.trim().toLowerCase(); if (!v) return;
    await sb.from('spaces').update({ code: v }).eq('id', space.id);
    if (space.id === 'centeno') await sb.from('config').update({ value: v }).eq('key', 'family_code');
    space.code = v; window._familyCode = v;
    localStorage.setItem('fgl_space', v);
    toast(t().codeChanged);
  });
  const ssDrawBtn = $('#ss-draw');
  if (ssDrawBtn) ssDrawBtn.addEventListener('click', async () => {
    if (!(await uiConfirm(space.draw_done ? t().ssRedrawConfirm : t().ssDrawConfirm))) return;
    const givers = allPeople.filter(p => p.active).map(p => p.id);
    const pairs = space.excluded_pairs || [];
    const banned = (g, r) => g === r || pairs.some(pr => (pr.a === g && pr.b === r) || (pr.a === r && pr.b === g));
    let receivers = null;
    for (let tries = 0; tries < 3000 && !receivers; tries++) {
      const cand = [...givers].sort(() => Math.random() - 0.5);
      if (givers.every((g, i) => !banned(g, cand[i]))) receivers = cand;
    }
    if (!receivers) { toast(t().ssDrawFail); return; }
    await sb.from('assignments').delete().eq('space', space.id);
    for (let i = 0; i < givers.length; i++) {
      await sb.from('assignments').insert({ space: space.id, giver_id: givers[i], receiver_id: receivers[i] });
    }
    await sb.from('spaces').update({ draw_done: true, draw_at: new Date().toISOString() }).eq('id', space.id);
    space.draw_done = true;
    await logActivity(me.id, null, null, 'ss_draw', `${givers.length} people`);
    toast(t().ssDrawDone); renderOrganizer();
  });
  const ssBudgetBtn = $('#ss-budget-save');
  if (ssBudgetBtn) ssBudgetBtn.addEventListener('click', async () => {
    const raw = $('#ss-budget').value.trim();
    const v = raw === '' ? null : Number(raw);
    await sb.from('spaces').update({ budget: v }).eq('id', space.id);
    space.budget = v; toast(t().savedOk); renderOrganizer();
  });
  $('#season').addEventListener('click', async () => {
    if (!(await uiConfirm(t().newSeasonConfirm))) return;
    const { data: spItems } = await sb.from('items').select('*').eq('archived', false);
    const myItemIds = (spItems || []).filter(i => inSpaceIds.has(i.owner_id)).map(i => i.id);
    if (myItemIds.length) {
      await sb.from('items').update({ archived: true, updated_at: new Date().toISOString() }).in('id', myItemIds);
      await sb.from('claims').update({ active: false }).in('item_id', myItemIds);
      await sb.from('pledges').update({ active: false }).in('item_id', myItemIds);
      await sb.from('waitlist').update({ active: false }).in('item_id', myItemIds);
    }
    await logActivity(me.id, null, null, 'new_season', '');
    toast(t().seasonDone); renderHome();
  });
}

boot();
</script>
</body>
</html>
