// Data shim: same call shapes the app already uses, backed by Firestore.
// Filtering happens in queries; sorting/limits are applied client-side (family-scale data,
// avoids Firestore composite-index requirements entirely).
function docToObj(d){ return Object.assign({ id: d.id }, d.data()); }
class QB {
  constructor(coll){ this.coll = coll; this.filters = []; this.orders = []; this.limitN = null; this.mode = 'select'; this.payload = null; this._single = false; }
  select(){ this.mode = 'select'; return this; }
  insert(payload){ this.mode = 'insert'; this.payload = payload; return this._exec(); }
  update(payload){ this.mode = 'update'; this.payload = payload; return this; }
  delete(){ this.mode = 'delete'; return this; }
  eq(f, v){ this.filters.push({ f, op: '==', v }); return this; }
  in(f, vals){ this.filters.push({ f, op: 'in', v: vals }); return this; }
  order(f, opts){ this.orders.push({ f, dir: (opts && opts.ascending === false) ? -1 : 1 }); return this; }
  limit(n){ this.limitN = n; return this; }
  single(){ this._single = true; return this._exec(); }
  then(res, rej){ return this._exec().then(res, rej); }
  _query(){
    let q = fdb.collection(this.coll);
    for (const flt of this.filters) q = q.where(flt.f, flt.op, flt.v);
    return q;
  }
  async _exec(){
    try {
      if (this.mode === 'insert') {
        const INSERT_DEFAULTS = {
          items: { archived: false },
          claims: { active: true },
          pledges: { active: true },
          waitlist: { active: true },
          flags: { seen: false },
          people: { active: true, pin: null, is_organizer: false }
        };
        const p = Object.assign({}, INSERT_DEFAULTS[this.coll] || {}, this.payload);
        if (!('created_at' in p)) p.created_at = new Date().toISOString();
        await fdb.collection(this.coll).add(p);
        return { data: null, error: null };
      }
      const snap = await this._query().get();
      const docs = snap.docs;
      if (this.mode === 'update') {
        const batch = fdb.batch();
        docs.forEach(d => batch.update(d.ref, this.payload));
        await batch.commit();
        return { data: null, error: null };
      }
      if (this.mode === 'delete') {
        const batch = fdb.batch();
        docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        return { data: null, error: null };
      }
      let rows = docs.map(docToObj);
      for (let i = this.orders.length - 1; i >= 0; i--) {
        const o = this.orders[i];
        rows.sort((a, b) => {
          const av = a[o.f] ?? '', bv = b[o.f] ?? '';
          if (av < bv) return -1 * o.dir;
          if (av > bv) return 1 * o.dir;
          return 0;
        });
      }
      if (this.limitN != null) rows = rows.slice(0, this.limitN);
      if (this._single) return { data: rows[0] || null, error: null };
      return { data: rows, error: null };
    } catch (e) {
      return { data: null, error: { message: String((e && e.message) || e) } };
    }
  }
}

async function boot(){
  setLang(lang);
  await ensureSeed();
  const { data: cfg } = await sb.from('config').select('*').eq('key','family_code').single();
  window._familyCode = cfg ? cfg.value : null;
  if (localStorage.getItem('fgl_code') !== 'ok') return renderGate();
  await loadPeople();
  const savedId = localStorage.getItem('fgl_person');
  me = people.find(p => p.id === savedId) || null;
  if (!me) return renderWho();
  lang = me.lang || lang; setLang(lang);
  renderHome();
}
async function loadPeople(){
  const { data } = await sb.from('people').select('*').eq('active', true).order('created_at');
  people = data || [];
  const { data: hs } = await sb.from('helpers').select('*');
  helpersMap = {};
  (hs || []).forEach(h => { (helpersMap[h.person_id] = helpersMap[h.person_id] || []).push(h.helper_id); });
}
function render(){ if (!me) { boot(); } else { renderHome(); } }

// ---------- Gate ----------
function renderGate(){
  $('#hdr-sub').textContent = '';
  app.innerHTML = `
    <div class="card">
      <h2>🔐 ${t().codeTitle}</h2>
      <p class="muted">${t().codeHelp}</p>
      <label>${t().codePh}</label>
      <input type="password" id="code-in" autocomplete="off">
      <div style="height:12px"></div>
      <button class="btn red" id="code-btn">${t().enter}</button>
    </div>`;
  const go = async () => {
    const v = $('#code-in').value.trim().toLowerCase();
    if (window._familyCode && v === String(window._familyCode).toLowerCase()) {
      localStorage.setItem('fgl_code', 'ok'); boot();
    } else toast(t().codeWrong);
  };
  $('#code-btn').addEventListener('click', go);
  $('#code-in').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

// ---------- Who ----------
function renderWho(){
  $('#hdr-sub').textContent = '';
  app.innerHTML = `
    <div class="card">
      <h2>👋 ${t().whoTitle}</h2>
      <p class="muted">${t().whoHelp}</p>
      <div class="person-grid">
        ${people.map(p => `<button class="person-btn" data-id="${p.id}"><span class="face">${faceFor(p.id)}</span>${esc(p.name)}</button>`).join('')}
      </div>
    </div>`;
  app.querySelectorAll('.person-btn').forEach(b => b.addEventListener('click', () => pickPerson(b.dataset.id)));
}
async function pickPerson(id){
  const p = people.find(x => x.id === id);
  if (!p) return;
  if (p.pin) {
    app.innerHTML = `
      <div class="card">
        <h2>🔢 ${t().pinTitle} — ${esc(p.name)}</h2>
        <p class="muted">${t().pinHelp}</p>
        <input type="password" id="pin-in" inputmode="numeric" autocomplete="off">
        <div style="height:12px"></div>
        <button class="btn red" id="pin-btn">${t().enter}</button>
        <button class="btn ghost" id="pin-back">${t().back}</button>
      </div>`;
    $('#pin-back').addEventListener('click', renderWho);
    const go = () => {
      if ($('#pin-in').value === p.pin) { me = p; finishPick(); } else toast(t().pinWrong);
    };
    $('#pin-btn').addEventListener('click', go);
    $('#pin-in').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }
  me = p; finishPick();
}
function finishPick(){
  localStorage.setItem('fgl_person', me.id);
  lang = me.lang || lang; setLang(lang);
  renderHome();
}

// ---------- Home ----------
function daysToChristmas(){
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((CHRISTMAS - today) / 86400000);
  return diff;
}

  $('#hdr-sub').textContent = `${t().hello}, ${me.name}`;
  const helped = people.filter(p => (helpersMap[p.id] || []).includes(me.id) && p.id !== me.id);
  const others = people.filter(p => p.id !== me.id);
  const d = daysToChristmas();
  const { data: myFlags } = await sb.from('flags').select('*').eq('for_person_id', me.id).eq('seen', false).order('created_at');
  app.innerHTML = `
    ${d > 0 ? `<div class="countdown">🎄 ${d} ${t().countdown}</div>` : (d === 0 ? `<div class="countdown">${t().today}</div>` : '')}
    ${(myFlags && myFlags.length) ? `<div class="card"><h2>📣 ${t().flagsTitle}</h2>${myFlags.map(f => `<div class="flag">${esc(f.message)}<br><button class="btn small ghost" data-flag="${f.id}">${t().flagDismiss}</button></div>`).join('')}</div>` : ''}

    ${helped.length ? `<div class="card"><h2>${t().helpLists}</h2>${helped.map(p => `<button class="btn ghost" data-help="${p.id}">🤝 ${esc(p.name)}</button>`).join('')}</div>` : ''}

    ${me.is_organizer ? `<button class="btn ghost" id="h-org">${t().organizer}</button>` : ''}
    <button class="btn ghost" id="h-switch">${t().switchPerson}</button>`;
  $('#h-mylist').addEventListener('click', () => renderOwnerList(me.id));
  app.querySelectorAll('[data-help]').forEach(b => b.addEventListener('click', () => renderOwnerList(b.dataset.help)));
  app.querySelectorAll('[data-shop]').forEach(b => b.addEventListener('click', () => renderShopList(b.dataset.shop)));

// ---------- Owner list (self or helper view — claims NEVER loaded here) ----------
function similar(a, b){
  a = (a||'').toLowerCase().trim(); b = (b||'').toLowerCase().trim();
  if (!a || !b) return false;
  if (a.includes(b) || b.includes(a)) return true;
  const aw = new Set(a.split(/\W+/).filter(w => w.length > 2));
  const bw = b.split(/\W+/).filter(w => w.length > 2);
  return bw.some(w => aw.has(w));
}

// When an owner/helper changes or removes an item that shoppers have claimed or pooled,
// flag those shoppers (they are told something changed — the owner learns nothing).
async function notifyClaimersChanged(itemId, item, owner){
  if (!item) return;
  const [{ data: claims }, { data: pledges }] = await Promise.all([
    sb.from('claims').select('*').eq('item_id', itemId).eq('active', true),
    sb.from('pledges').select('*').eq('item_id', itemId).eq('active', true)
  ]);
  const targets = new Set();
  (claims||[]).forEach(c => targets.add(c.claimer_id));
  (pledges||[]).forEach(p => targets.add(p.person_id));
  targets.delete(owner.id);
  for (const pid of targets) await flag(pid, itemId, t().itemChangedFlag(item.title, owner.name));
}
// ---------- Shopper list (claims + pools visible) ----------
async function renderShopList(ownerId){
  const owner = people.find(p => p.id === ownerId);
  const { data: items } = await sb.from('items').select('*').eq('owner_id', ownerId).eq('archived', false).order('priority').order('created_at');
  const ids = (items || []).map(i => i.id);
  let claims = [], pledges = [], line = [];
  if (ids.length) {
    const [c, p, w] = await Promise.all([
      sb.from('claims').select('*').in('item_id', ids).eq('active', true),
      sb.from('pledges').select('*').in('item_id', ids).eq('active', true),
      sb.from('waitlist').select('*').in('item_id', ids).eq('active', true).order('created_at')
    ]);
    claims = c.data || []; pledges = p.data || []; line = w.data || [];
  }
  const prioStars = (n) => '⭐'.repeat(4 - n);
  const itemHtml = (it) => {
    const claim = claims.find(c => c.item_id === it.id);
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooled = pls.reduce((s, p) => s + Number(p.amount), 0);
    const funded = it.price != null && pooled >= Number(it.price) && pls.length > 0;
    const myPledge = pls.find(p => p.person_id === me.id);
    const waiters = line.filter(w => w.item_id === it.id);
    const myLine = waiters.find(w => w.person_id === me.id);
    let chips = '';
    if (claim) chips += `<span class="chip ${claim.status === 'bought' ? 'bought' : 'claimed'}">${claim.status === 'bought' ? t().statusBought(personName(claim.claimer_id)) : t().statusClaimed(personName(claim.claimer_id))}</span>`;
    else if (funded) chips += `<span class="chip funded">${t().statusFunded}</span><span class="chip pool">${t().statusPool(pooled, it.price)}</span>`;
    else if (pls.length) chips += `<span class="chip pool">${t().statusPool(pooled, it.price)}</span>`;
    else chips += `<span class="chip open">${t().statusOpen}</span>`;
    if (waiters.length) chips += `<span class="chip">${t().inLine(waiters.map(w => personName(w.person_id)).join(', '))}</span>`;
    let actions = '';
    if (claim && claim.claimer_id === me.id) {
      if (claim.status === 'claimed') actions += `<button class="btn small green" data-bought="${it.id}">${t().markBought}</button>`;
      actions += `<button class="btn small ghost" data-release="${it.id}">${t().release}</button>`;
    } else if (!claim && !funded && !pls.length) {
      actions += `<button class="btn small red" data-claim="${it.id}">${t().claim}</button>`;
    }
    if (!claim && it.price != null && !funded) {
      actions += myPledge
        ? `<button class="btn small ghost" data-withdraw="${it.id}">${t().release} (${money(myPledge.amount)})</button>`
        : `<span class="rowflex"><input type="number" id="pl-${it.id}" placeholder="${t().pledgePh}" min="1" step="0.01" inputmode="decimal" style="max-width:150px"><button class="btn small green" data-pledge="${it.id}">${t().joinPool}</button></span>`;
    }
    if (claim && claim.claimer_id !== me.id) {
      actions += myLine
        ? `<button class="btn small ghost" data-unline="${it.id}">${t().leaveLine}</button><span class="muted">${t().youNext}</span>`
        : `<button class="btn small ghost" data-line="${it.id}">${t().getInLine}</button>`;
    }
    return `
      <div class="item">
        <h3>${esc(it.title)}</h3>
        <span class="prio">${prioStars(it.priority)}</span>
        ${it.price != null ? `<span class="price">${money(it.price)}</span>` : `<span class="muted">${t().noPrice}</span>`}
        ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ''}
        ${it.url ? `<div><a class="buy" href="${esc(it.url)}" target="_blank" rel="noopener">${t().viewLink}</a></div>` : ''}
        <div style="margin:8px 0">${chips}</div>
        <div class="rowflex">${actions}</div>
      </div>`;
  };
  app.innerHTML = `
    <button class="btn small ghost" id="s-back">${t().backHome}</button>
    <div class="hat shop">${t().hatShop(me.name)}</div>
    <div class="card"><h2>${faceFor(owner.id)} ${esc(owner.name)}</h2>
      ${(items && items.length) ? items.map(itemHtml).join('') : `<p class="muted">${t().emptyListShop}</p>`}
    </div>`;
  $('#s-back').addEventListener('click', renderHome);
  const rerender = () => renderShopList(ownerId);
  app.querySelectorAll('[data-claim]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.claim);
    const { data: existing } = await sb.from('claims').select('*').eq('item_id', it.id).eq('active', true);
    if (existing && existing.length) { toast(t().statusClaimed(personName(existing[0].claimer_id))); return rerender(); }
    const { error } = await sb.from('claims').insert({ item_id: it.id, claimer_id: me.id, status: 'claimed' });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'claim', it.title);
    toast(t().claimedOk); rerender();
  }));
  app.querySelectorAll('[data-bought]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.bought);
    await sb.from('claims').update({ status: 'bought' }).eq('item_id', it.id).eq('claimer_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'bought', it.title);
    toast(t().boughtOk); rerender();
  }));
  app.querySelectorAll('[data-release]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t().confirmRelease)) return;
    const it = items.find(x => x.id === b.dataset.release);
    await sb.from('claims').update({ active: false }).eq('item_id', it.id).eq('claimer_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'release', it.title);
    const { data: w } = await sb.from('waitlist').select('*').eq('item_id', it.id).eq('active', true).order('created_at').limit(1);
    if (w && w.length) await flag(w[0].person_id, it.id, t().yourTurnFlag(it.title, owner.name));
    toast(t().releasedOk); rerender();
  }));
  app.querySelectorAll('[data-pledge]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.pledge);
    const inp = $(`#pl-${it.id}`); const amt = Number(inp.value);
    if (!amt || amt <= 0) { inp.focus(); return; }
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooled = pls.reduce((s, p) => s + Number(p.amount), 0);
    const remaining = Math.max(0, Number(it.price) - pooled);
    const finalAmt = Math.min(amt, remaining);
    if (finalAmt <= 0) { toast(t().poolDone); return; }
    const { error } = await sb.from('pledges').insert({ item_id: it.id, person_id: me.id, amount: finalAmt });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'pledge', `${it.title} $${finalAmt}`);
    toast(t().pledgedOk); rerender();
  }));
  app.querySelectorAll('[data-withdraw]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t().confirmWithdraw)) return;
    const it = items.find(x => x.id === b.dataset.withdraw);
    const pls = pledges.filter(p => p.item_id === it.id);
    const pooledBefore = pls.reduce((s, p) => s + Number(p.amount), 0);
    const wasFunded = it.price != null && pooledBefore >= Number(it.price);
    await sb.from('pledges').update({ active: false }).eq('item_id', it.id).eq('person_id', me.id).eq('active', true);
    await logActivity(me.id, ownerId, it.id, 'withdraw', it.title);
    if (wasFunded) {
      for (const p of pls) if (p.person_id !== me.id) await flag(p.person_id, it.id, t().unfundedFlag(it.title, owner.name));
    }
    toast(t().withdrewOk); rerender();
  }));
  app.querySelectorAll('[data-line]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.line);
    const { error } = await sb.from('waitlist').insert({ item_id: it.id, person_id: me.id });
    if (error) { toast(error.message); return; }
    await logActivity(me.id, ownerId, it.id, 'line', it.title);
    toast(t().lineOk); rerender();
  }));
  app.querySelectorAll('[data-unline]').forEach(b => b.addEventListener('click', async () => {
    const it = items.find(x => x.id === b.dataset.unline);
    await sb.from('waitlist').update({ active: false }).eq('item_id', it.id).eq('person_id', me.id).eq('active', true);
    toast(t().leftLineOk); rerender();
  }));
}

// ---------- My claims & pools ----------
async function renderMyClaims(){
  const [{ data: claims }, { data: pledges }, { data: line }] = await Promise.all([
    sb.from('claims').select('*').eq('claimer_id', me.id).eq('active', true).order('created_at', { ascending: false }),
    sb.from('pledges').select('*').eq('person_id', me.id).eq('active', true).order('created_at', { ascending: false }),
    sb.from('waitlist').select('*').eq('person_id', me.id).eq('active', true).order('created_at', { ascending: false })
  ]);
  const itemIds = [...new Set([...(claims||[]), ...(pledges||[]), ...(line||[])].map(x => x.item_id))];
  let itemsById = {};
  if (itemIds.length) {
    const { data: its } = await sb.from('items').select('*').in('id', itemIds);
    (its || []).forEach(i => itemsById[i.id] = i);
  }
  const row = (inner) => `<div class="item">${inner}</div>`;
  app.innerHTML = `
    <button class="btn small ghost" id="c-back">${t().backHome}</button>
    <div class="card"><h2>${t().yourClaimsTitle}</h2>
    ${(!claims?.length && !pledges?.length && !line?.length) ? `<p class="muted">${t().noClaims}</p>` : ''}
    ${(claims||[]).map(c => { const it = itemsById[c.item_id]; if (!it) return ''; return row(`
      <h3>${esc(it.title)}</h3>
      <span class="chip ${c.status === 'bought' ? 'bought' : 'claimed'}">${t().youClaimed} — ${esc(personName(it.owner_id))}</span>
      ${it.archived ? `<span class="chip claimed">⚠️ ${t().removedItems}</span>` : ''}
      ${it.price != null ? `<span class="price">${money(it.price)}</span>` : ''}
      ${it.url ? `<div><a class="buy" href="${esc(it.url)}" target="_blank" rel="noopener">${t().viewLink}</a></div>` : ''}
      <label>${t().yourNote}</label>
      <input type="text" id="note-${c.id}" value="${esc(c.private_note || '')}">
      <div class="rowflex" style="margin-top:8px">
        <button class="btn small ghost" data-note="${c.id}">${t().save}</button>
        ${c.status === 'claimed' ? `<button class="btn small green" data-cbought="${c.id}">${t().markBought}</button>` : ''}
        <button class="btn small ghost" data-crelease="${c.id}">${t().release}</button>
      </div>`); }).join('')}
    ${(pledges||[]).map(p => { const it = itemsById[p.item_id]; if (!it) return ''; return row(`
      <h3>${esc(it.title)}</h3>
      <span class="chip pool">${t().youPledged(p.amount)} — ${esc(personName(it.owner_id))}</span>
      ${it.archived ? `<span class="chip claimed">⚠️ ${t().removedItems}</span>` : ''}
      <div class="rowflex" style="margin-top:8px"><button class="btn small ghost" data-pwithdraw="${p.id}">${t().release}</button></div>`); }).join('')}
    ${(line||[]).map(w => { const it = itemsById[w.item_id]; if (!it) return ''; return row(`
      <h3>${esc(it.title)}</h3>
      <span class="chip">${t().inLine(personName(me.id))} — ${esc(personName(it.owner_id))}</span>
      <div class="rowflex" style="margin-top:8px"><button class="btn small ghost" data-wleave="${w.id}">${t().leaveLine}</button></div>`); }).join('')}
    </div>`;
  $('#c-back').addEventListener('click', renderHome);
  app.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('claims').update({ private_note: $(`#note-${b.dataset.note}`).value }).eq('id', b.dataset.note);
    toast(t().noteSaved);
  }));
  app.querySelectorAll('[data-cbought]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('claims').update({ status: 'bought' }).eq('id', b.dataset.cbought); toast(t().boughtOk); renderMyClaims();
  }));
  app.querySelectorAll('[data-crelease]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t().confirmRelease)) return;
    const c = (claims||[]).find(x => x.id === b.dataset.crelease);
    await sb.from('claims').update({ active: false }).eq('id', b.dataset.crelease);
    if (c) {
      const it = itemsById[c.item_id];
      const { data: w } = await sb.from('waitlist').select('*').eq('item_id', c.item_id).eq('active', true).order('created_at').limit(1);
      if (w && w.length && it) await flag(w[0].person_id, c.item_id, t().yourTurnFlag(it.title, personName(it.owner_id)));
    }
    toast(t().releasedOk); renderMyClaims();
  }));
  app.querySelectorAll('[data-pwithdraw]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t().confirmWithdraw)) return;
    await sb.from('pledges').update({ active: false }).eq('id', b.dataset.pwithdraw);
    toast(t().withdrewOk); renderMyClaims();
  }));
  app.querySelectorAll('[data-wleave]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('waitlist').update({ active: false }).eq('id', b.dataset.wleave);
    toast(t().leftLineOk); renderMyClaims();
  }));
}
// ---------- Organizer ----------
async function renderOrganizer(){
  const { data: allPeople } = await sb.from('people').select('*').order('created_at');
  const { data: allHelpers } = await sb.from('helpers').select('*');
  const { data: acts } = await sb.from('activity').select('*').order('created_at', { ascending: false }).limit(40);
  const nameOf = (id) => (allPeople.find(p => p.id === id) || {}).name || '—';
  app.innerHTML = `
    <button class="btn small ghost" id="g-back">${t().backHome}</button>
    <div class="card">
      <h2>${t().orgTitle}</h2>
      <h3>${t().addPerson}</h3>
      <input type="text" id="np-name" placeholder="${t().namePh}">
      <label>${t().langLabel}</label>
      <select id="np-lang"><option value="en">English</option><option value="es">Español</option></select>
      <div style="height:10px"></div>
      <button class="btn red" id="np-add">${t().addBtn}</button>
    </div>
    <div class="card">
      <h2>${t().peopleTitle}</h2>
      ${(allPeople||[]).map(p => {
        const hs = (allHelpers||[]).filter(h => h.person_id === p.id).map(h => h.helper_id);
        return `<div class="item">
          <h3>${faceFor(p.id)} ${esc(p.name)} ${p.active ? '' : `<span class="chip">${t().inactive}</span>`} ${p.is_organizer ? '🛠️' : ''}</h3>
          <div class="muted">${t().helpersFor}: ${hs.length ? hs.map(nameOf).join(', ') : '—'}</div>
          <label>${t().helpersFor} ${esc(p.name)}:</label>
          <div class="rowflex">
            <select id="help-${p.id}">${(allPeople||[]).filter(x => x.id !== p.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
            <button class="btn small green" data-addhelp="${p.id}">${t().addBtn}</button>
          </div>
          <div class="rowflex" style="margin-top:6px">
            ${hs.map(hid => `<button class="btn small ghost" data-delhelp="${p.id}:${hid}">✕ ${esc(nameOf(hid))}</button>`).join('')}
          </div>
          <div class="rowflex" style="margin-top:8px">
            <button class="btn small ghost" data-pin="${p.id}">${t().setPin}</button>
            ${p.pin ? `<button class="btn small ghost" data-unpin="${p.id}">${t().clearPin}</button>` : ''}
            ${p.id !== me.id ? `<button class="btn small ghost" data-toggle="${p.id}">${p.active ? t().deactivate : t().reactivate}</button>` : ''}
          </div>
        </div>`; }).join('')}
    </div>
    <div class="card">
      <h2>🔐 ${t().changeCode}</h2>
      <input type="text" id="new-code" value="${esc(window._familyCode || '')}">
      <div style="height:10px"></div>
      <button class="btn ghost" id="code-save">${t().save}</button>
    </div>
    <div class="card">
      <h2>${t().activityTitle}</h2>
      <div class="log">${(acts||[]).map(a => `<div>${new Date(a.created_at).toLocaleString()} — <b>${esc(nameOf(a.actor_id))}</b> ${esc(a.type)} ${a.detail ? '· ' + esc(a.detail) : ''}</div>`).join('') || t().nothingHere}</div>
    </div>
    <div class="card">
      <button class="btn ghost" id="season">${t().newSeason}</button>
    </div>`;
  $('#g-back').addEventListener('click', renderHome);
  $('#np-add').addEventListener('click', async () => {
    const name = $('#np-name').value.trim(); if (!name) { $('#np-name').focus(); return; }
    const { error } = await sb.from('people').insert({ name, lang: $('#np-lang').value });
    if (error) { toast(error.message); return; }
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  });
  app.querySelectorAll('[data-addhelp]').forEach(b => b.addEventListener('click', async () => {
    const pid = b.dataset.addhelp; const hid = $(`#help-${pid}`).value;
    const { error } = await sb.from('helpers').insert({ person_id: pid, helper_id: hid });
    if (error && !String(error.message).includes('duplicate')) { toast(error.message); return; }
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  app.querySelectorAll('[data-delhelp]').forEach(b => b.addEventListener('click', async () => {
    const [pid, hid] = b.dataset.delhelp.split(':');
    await sb.from('helpers').delete().eq('person_id', pid).eq('helper_id', hid);
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  app.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', async () => {
    const pin = prompt('PIN (4 digits):'); if (!pin) return;
    await sb.from('people').update({ pin }).eq('id', b.dataset.pin);
    await loadPeople(); toast(t().pinSet); renderOrganizer();
  }));
  app.querySelectorAll('[data-unpin]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('people').update({ pin: null }).eq('id', b.dataset.unpin);
    await loadPeople(); toast(t().pinSet); renderOrganizer();
  }));
  app.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    const p = allPeople.find(x => x.id === b.dataset.toggle);
    await sb.from('people').update({ active: !p.active }).eq('id', p.id);
    await loadPeople(); toast(t().savedOk); renderOrganizer();
  }));
  $('#code-save').addEventListener('click', async () => {
    const v = $('#new-code').value.trim(); if (!v) return;
    await sb.from('config').update({ value: v }).eq('key', 'family_code');
    window._familyCode = v; toast(t().codeChanged);
  });
  $('#season').addEventListener('click', async () => {
    if (!confirm(t().newSeasonConfirm)) return;
    await sb.from('items').update({ archived: true, updated_at: new Date().toISOString() }).eq('archived', false);
    await sb.from('claims').update({ active: false }).eq('active', true);
    await sb.from('pledges').update({ active: false }).eq('active', true);
    await sb.from('waitlist').update({ active: false }).eq('active', true);
    await logActivity(me.id, null, null, 'new_season', '');
    toast(t().seasonDone); renderHome();
  });
}

boot();
</script>
</body>
</html>
